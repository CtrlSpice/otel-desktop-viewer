name: Build and Test

on: 
  pull_request:

permissions:
  contents: read

env:
  EVALS: '0'

# Cancel superseded runs for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser-pro
        version: v2.19.0
        # Legacy Docker publishing remains supported by this pinned release.
        args: check --soft

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: ${{ matrix.env }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            env:
              CGO_ENABLED: 1
              NO_WINDOWS_SERVICE: 0
          - os: macos-latest
            env:
              CGO_ENABLED: 1
              GOOS: darwin
              GOARCH: arm64

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    # duckdb-go-bindings' Windows archive requires the C:\mingw64 toolchain (#324).
    - name: Pin the C toolchain cgo uses (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $bin = 'C:\mingw64\bin'
        if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) {
          Write-Host "::error::No gcc at $bin. The windows runner image has shipped one there; if that changed, a toolchain matching duckdb-go-bindings' prebuilt libduckdb_static.a must be installed instead. See #324."
          exit 1
        }
        echo $bin >> $env:GITHUB_PATH

    - name: Verify cgo uses it (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $actual = (Get-Command gcc -ErrorAction SilentlyContinue).Source
        Write-Host "cgo will use $actual"
        if ($actual -ne 'C:\mingw64\bin\gcc.exe') {
          Write-Host "::error::cgo would use $actual, not the pinned C:\mingw64 toolchain."
          exit 1
        }
        gcc --version | Select-Object -First 1

    - name: Build
      run: go build -o otel-desktop-viewer.exe
      if: matrix.os == 'windows-latest'

    - name: Build
      run: go build -o otel-desktop-viewer
      if: matrix.os != 'windows-latest'

    # Include the root CLI package and desktopexporter packages.
    - name: Go Tests
      run: go test ./...

    - name: Windows executable smoke
      if: matrix.os == 'windows-latest'
      run: ./.github/scripts/smoke-viewer.ps1 -Executable (Resolve-Path ./otel-desktop-viewer.exe).Path

  # These source checks need neither CGO nor the platform matrix.
  go-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Format check (gofmt)
      run: make format-go-check

    # Production DuckDB access must remain ordered by Store methods.
    - name: No unguarded store access outside tests
      run: |
        if grep -rn --include='*.go' '\.DB()' desktopexporter/ | grep -v '_test\.go'; then
          echo "::error::Production code must use Store.WithDBRead/WithDBWrite, not a raw *sql.DB."
          exit 1
        fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        evals: ['0', '1']
    env:
      EVALS: ${{ matrix.evals }}
    defaults:
      run:
        working-directory: desktopexporter/internal/frontend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: desktopexporter/internal/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Fail before the browser jobs if the committed public bundle is stale.
    - name: Built assets are current
      working-directory: ${{ github.workspace }}
      run: make build-ts-check

    # The committed parser must match query.grammar.
    - name: Generated parser matches the grammar
      run: |
        npm run generate:grammar
        git diff --exit-code src/components/shared/Search/codemirror/

    - name: Lint (Oxlint)
      run: npm run lint

    - name: Type check (svelte-check)
      run: npm run check

    - name: Type check (Playwright)
      run: npx tsc --project tsconfig.playwright.json

    - name: Unit tests (Vitest)
      run: npm test

    - name: Format check (Prettier)
      run: npm run format:check

  browser:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        evals: ['0', '1']
        shard: [1, 2, 3, 4]
    env:
      EVALS: ${{ matrix.evals }}
    defaults:
      run:
        working-directory: desktopexporter/internal/frontend
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: desktopexporter/internal/frontend/package-lock.json
    - run: npm ci
    - name: Install Chromium for Playwright
      timeout-minutes: 15
      run: npx playwright install --with-deps chromium

    - name: Browser and accessibility tests
      run: npm run test:a11y -- --shard=${{ matrix.shard }}/4

    - name: Upload Playwright artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-evals-${{ matrix.evals }}-shard-${{ matrix.shard }}
        path: |
          desktopexporter/internal/frontend/playwright-report/
          desktopexporter/internal/frontend/test-results/
        if-no-files-found: ignore
        retention-days: 14

  embedded-smoke:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: desktopexporter/internal/frontend/package-lock.json
    - run: npm ci
      working-directory: desktopexporter/internal/frontend
    - name: Install Chromium
      timeout-minutes: 15
      run: npx playwright install --with-deps chromium
      working-directory: desktopexporter/internal/frontend
    - name: Build public executable with committed assets
      run: go build -o otel-desktop-viewer
    - name: Exercise embedded UI, ingestion and export
      run: node desktopexporter/internal/frontend/scripts/smoke-binary.mjs ./otel-desktop-viewer

  evals-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVALS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktopexporter/internal/frontend/package-lock.json
      - run: npm ci
        working-directory: desktopexporter/internal/frontend
      - run: make test-go EVALS=1
      - name: Public binary excludes Evals implementation
        run: |
          go list -deps . > public-dependencies.txt
          if grep -E '/internal/(evaldecode|store/evals)$|github.com/open-feature/' public-dependencies.txt; then
            echo 'Public build includes an Evals dependency'
            exit 1
          fi
