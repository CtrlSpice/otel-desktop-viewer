# This workflow builds and tests the OpenTelemetry Desktop Viewer
# It ensures the application builds successfully on all supported platforms
# and runs the test suite for the desktopexporter component.

name: Build and Test

on: 
  pull_request:

permissions:
  contents: read

# Only the newest commit on a branch is worth building. Without this, pushing a
# follow-up while a run is in flight leaves both going: the older one finishes
# against code nobody will look at, and on a three-platform matrix that is real
# runner time -- the Windows job alone runs 5-8 minutes.
#
# It also fixes a subtler problem. actions/setup-go caches GOMODCACHE and
# GOCACHE keyed on go.sum, and GitHub caches are immutable: the first run to
# finish saves the key, and any run that started before that save restores
# nothing and then fails to save ("another job may be creating this cache").
# Overlapping runs therefore both miss, and on Windows a miss is ~110s of
# recompiling DuckDB's C++. Serialising the branch means the cache is written
# once and hit thereafter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            env:
              CGO_ENABLED: 1
              NO_WINDOWS_SERVICE: 0
          - os: macos-latest
            env:
              CGO_ENABLED: 1
              GOOS: darwin
              GOARCH: arm64

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    # DuckDB is cgo, so Windows needs a C compiler. It does not need one
    # installed here: the runner image ships mingw64 at C:\mingw64 and puts it
    # on PATH, which is what cgo has actually been resolving all along.
    #
    # This used to run msys2/setup-msys2 and then prepend C:\msys64\ucrt64\bin.
    # Probed on a real run (#324): before that step, neither C:\msys64 nor
    # RUNNER_TEMP\msys64 held a ucrt64 gcc, and after it, gcc still resolved to
    # C:\mingw64\bin\gcc.exe. Sixty-one seconds -- eight extracting the base,
    # forty-eight installing 43 packages past a cache hit -- built a toolchain
    # no compile ever used.
    #
    # The cost of leaning on the image is that the image can change. This step
    # is the alarm: without it a removed preinstall surfaces as a cgo error
    # deep in a DuckDB build, which reads like a code problem. Reinstating
    # MSYS2 is the fix if it ever fires.
    - name: Check the C toolchain cgo needs (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $gcc = Get-Command gcc -ErrorAction SilentlyContinue
        if (-not $gcc) {
          Write-Host "::error::No gcc on PATH. The windows runner image used to ship one at C:\mingw64; if that has changed, restore the msys2/setup-msys2 step removed in #324."
          exit 1
        }
        Write-Host "cgo will use $($gcc.Source)"
        gcc --version | Select-Object -First 1

    - name: Set up MSYS2 (Windows)
      id: msys2
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-toolchain

    # TEMPORARY: where did it actually go, and what does it call itself?
    - name: Locate the installed toolchain (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Write-Host "msys2-location output = '${{ steps.msys2.outputs.msys2-location }}'"
        Get-ChildItem -Path C:\, D:\a\_temp -Filter msys64 -Directory -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "root: $($_.FullName)" }
        Get-ChildItem -Path C:\, D:\a\_temp -Recurse -Depth 4 -Filter gcc.exe -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "gcc: $($_.FullName)" }

    - name: Build
      run: go build -o otel-desktop-viewer.exe
      if: matrix.os == 'windows-latest'

    - name: Build
      run: go build -o otel-desktop-viewer
      if: matrix.os != 'windows-latest'

    # ./... from the repo root, not from desktopexporter. Scoping it to the
    # subdirectory left the root package -- the CLI, its flag wiring and the
    # composed collector config -- untested by anything. main_test.go stopped
    # compiling when a collector bump removed xconfmap.Validate, and nothing
    # reported it: seven tests, including the ones covering the flags a release
    # ships, were silently absent for a whole dependency cycle.
    - name: Go Tests
      run: go test ./...

  # Go source checks that need no CGO and no DuckDB toolchain, so they run once
  # on Linux rather than across the build matrix (which includes Windows, where
  # this shell syntax differs).
  go-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    # The frontend job gates Prettier; this is the Go equivalent.
    - name: Format check (gofmt)
      run: make format-go-check

    # Guards the store's concurrency model: production code must reach DuckDB
    # through Store.WithConn, WithDBRead, or WithDBWrite so access is ordered
    # against ingest, retention, and Close. A raw *sql.DB handed to a caller
    # escapes that ordering, which is what issue #238 fixed.
    - name: No unguarded store access outside tests
      run: |
        if grep -rn --include='*.go' '\.DB()' desktopexporter/ | grep -v '_test\.go'; then
          echo "::error::Production code must use Store.WithDBRead/WithDBWrite, not a raw *sql.DB."
          exit 1
        fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktopexporter/internal/frontend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: desktopexporter/internal/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check (svelte-check)
      run: npm run check

    - name: Unit tests (Vitest)
      run: npm test

    - name: Format check (Prettier)
      run: npm run format:check

    # The built bundle is committed and served by the Go binary, so it can go
    # stale without any source file changing -- a dependency bump alone is
    # enough. Nothing caught that, and the drift would surface inside whichever
    # unrelated PR next ran build-ts. Runs from the repo root because the
    # comparison spans both the frontend and the embedded copy.
    - name: Built assets are current
      working-directory: ${{ github.workspace }}
      run: make build-ts-check
