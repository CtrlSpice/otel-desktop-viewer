
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  packages: write
  actions: write
jobs:
  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktopexporter/internal/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktopexporter/internal/frontend
      - name: Build embedded frontend
        run: make build-ts
      - name: Upload embedded frontend
        uses: actions/upload-artifact@v7
        with:
          name: embedded-frontend
          path: desktopexporter/internal/server/static/
          retention-days: 1

  prepare:
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_id: macos_amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            build_id: macos_arm64
            goos: darwin
            goarch: arm64
          - os: ubuntu-24.04
            build_id: linux_amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            build_id: linux_arm64
            goos: linux
            goarch: arm64
          - os: windows-latest
            build_id: windows_amd64
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: embedded-frontend
          path: desktopexporter/internal/server/static/
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Tidy Go module
        run: go mod tidy
      - name: Set up MSYS2 (Windows)
        id: msys2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain
      # Point cgo at the toolchain installed just above, and prove it took.
      #
      # This used to read `echo "C:\msys64\ucrt64\bin"`, which is not where
      # setup-msys2 installs -- it installs under RUNNER_TEMP, and reports the
      # path as its msys2-location output. C:\msys64 does exist on the runner
      # image, but carries no ucrt64 gcc, so the line added a directory with no
      # compiler in it and cgo fell through to whatever else was on PATH.
      #
      # That mattered because the image ships five: C:\mingw32, C:\mingw64,
      # C:\rtools45, C:\Strawberry\c, plus the one we install. cgo was
      # resolving C:\mingw64\bin\gcc.exe -- picked by PATH order, not by us,
      # and free to change when the image does. Probed on a real run (#324).
      #
      # The check is the load-bearing half. Naming the right directory is only
      # correct until something prepends another gcc, and the failure mode is
      # silent: it still builds, just not with the pinned toolchain.
      - name: Add MSYS2 to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) {
            Write-Host "::error::No gcc in $bin -- setup-msys2 did not install where its msys2-location output says."
            exit 1
          }
          echo $bin >> $env:GITHUB_PATH

      # Prove the pinned toolchain is the one cgo will use. The runner image ships
      # five compilers, and while the PATH line named a directory without a gcc,
      # cgo silently resolved C:\mingw64\bin\gcc.exe instead (#324). Nothing
      # failed, so nothing reported it.
      - name: Verify cgo uses the pinned toolchain (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $expected = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin\gcc.exe'
          $actual = (Get-Command gcc -ErrorAction SilentlyContinue).Source
          Write-Host "expected: $expected"
          Write-Host "actual:   $actual"
          if ($actual -ne $expected) {
            Write-Host "::error::cgo would use $actual, not the toolchain this workflow installs."
            exit 1
          }
          gcc --version | Select-Object -First 1

      - name: Set up Docker Buildx
        if: matrix.goos == 'linux'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: matrix.goos == 'linux'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: v2.16.0
          # Use GGOOS/GGOARCH to filter targets with partial.by: target
          args: release --clean --split ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          CGO_ENABLED: 1
          GGOOS: ${{ matrix.goos }}
          GGOARCH: ${{ matrix.goarch }}
          PRERELEASE_PUBLISH: ${{ vars.PRERELEASE_PUBLISH }}
          FURY_ACCOUNT: ${{ vars.FURY_ACCOUNT }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          MACOS_SIGN_P12: ${{ matrix.goos == 'darwin' && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ matrix.goos == 'darwin' && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_NOTARY_KEY: ${{ matrix.goos == 'darwin' && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ matrix.goos == 'darwin' && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ matrix.goos == 'darwin' && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
      - name: Verify GoReleaser partial artifact
        shell: bash
        run: |
          set -euo pipefail
          dir="dist/${{ matrix.goos }}_${{ matrix.goarch }}"
          if [[ ! -d "$dir" ]] || [[ -z "$(find "$dir" -type f | head -1)" ]]; then
            echo "::error::GoReleaser did not produce partial artifacts in $dir"
            find dist -type f 2>/dev/null || true
            exit 1
          fi
          echo "Partial artifacts ready in $dir:"
          find "$dir" -type f | head -20
      - name: Cache GoReleaser contexts
        uses: actions/cache@v6
        with:
          path: dist/${{ matrix.goos }}_${{ matrix.goarch }}
          key: ${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.sha }}
          enableCrossOsArchive: ${{ matrix.os == 'windows-latest' }}



  release:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Restore GoReleaser build artifacts (darwin-amd64)
        uses: actions/cache@v6
        with:
          path: dist/darwin_amd64
          key: darwin-amd64-${{ github.sha }}
      - name: Restore GoReleaser build artifacts (darwin-arm64)
        uses: actions/cache@v6
        with:
          path: dist/darwin_arm64
          key: darwin-arm64-${{ github.sha }}
      - name: Restore GoReleaser build artifacts (linux-amd64)
        uses: actions/cache@v6
        with:
          path: dist/linux_amd64
          key: linux-amd64-${{ github.sha }}
      - name: Restore GoReleaser build artifacts (linux-arm64)
        uses: actions/cache@v6
        with:
          path: dist/linux_arm64
          key: linux-arm64-${{ github.sha }}
      - name: Restore GoReleaser build artifacts (windows-amd64)
        uses: actions/cache@v6
        with:
          path: dist/windows_amd64
          key: windows-amd64-${{ github.sha }}
          enableCrossOsArchive: true
      - name: Verify restored GoReleaser partial artifacts
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            darwin_amd64
            darwin_arm64
            linux_amd64
            linux_arm64
            windows_amd64
          )
          missing=()
          for target in "${targets[@]}"; do
            dir="dist/${target}"
            if [[ ! -d "$dir" ]] || [[ -z "$(find "$dir" -type f 2>/dev/null | head -1)" ]]; then
              missing+=("$target")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing or empty GoReleaser partial artifacts (cache miss?): ${missing[*]}"
            find dist -type f 2>/dev/null || true
            exit 1
          fi
          echo "All partial artifacts restored:"
          find dist -type f | head -50
      - name: Generate release app token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            otel-desktop-viewer
            homebrew-otel-desktop-viewer
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Complete release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: v2.16.0
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          # Set repo variable PRERELEASE_PUBLISH=true to push alpha/beta/rc to Homebrew, GHCR, and GemFury.
          PRERELEASE_PUBLISH: ${{ vars.PRERELEASE_PUBLISH }}
          FURY_ACCOUNT: ${{ vars.FURY_ACCOUNT }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
