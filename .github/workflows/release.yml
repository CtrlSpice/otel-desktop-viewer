
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  packages: write
  actions: write
env:
  EVALS: '0'
jobs:
  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktopexporter/internal/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktopexporter/internal/frontend
      - name: Build embedded frontend
        run: make build-ts EVALS=0
      - name: Upload embedded frontend
        uses: actions/upload-artifact@v7
        with:
          name: embedded-frontend
          path: desktopexporter/internal/server/static/
          retention-days: 1

  prepare:
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_id: macos_arm64
            goos: darwin
            goarch: arm64
          - os: ubuntu-24.04
            build_id: linux_amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            build_id: linux_arm64
            goos: linux
            goarch: arm64
          - os: windows-latest
            build_id: windows_amd64
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: embedded-frontend
          path: desktopexporter/internal/server/static/
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Tidy Go module
        run: go mod tidy
      # duckdb-go-bindings' Windows archive requires the C:\mingw64 toolchain (#324).
      - name: Pin the C toolchain cgo uses (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $bin = 'C:\mingw64\bin'
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) {
            Write-Host "::error::No gcc at $bin. The windows runner image has shipped one there; if that changed, a toolchain matching duckdb-go-bindings' prebuilt libduckdb_static.a must be installed instead. See #324."
            exit 1
          }
          echo $bin >> $env:GITHUB_PATH

      - name: Verify cgo uses it (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $actual = (Get-Command gcc -ErrorAction SilentlyContinue).Source
          Write-Host "cgo will use $actual"
          if ($actual -ne 'C:\mingw64\bin\gcc.exe') {
            Write-Host "::error::cgo would use $actual, not the pinned C:\mingw64 toolchain."
            exit 1
          }
          gcc --version | Select-Object -First 1

      - name: Set up Docker Buildx
        if: matrix.goos == 'linux'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: matrix.goos == 'linux'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: v2.19.0
          # GGOOS and GGOARCH select the partial target.
          args: release --clean --split ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          CGO_ENABLED: 1
          GGOOS: ${{ matrix.goos }}
          GGOARCH: ${{ matrix.goarch }}
          PRERELEASE_PUBLISH: ${{ vars.PRERELEASE_PUBLISH }}
          FURY_ACCOUNT: ${{ vars.FURY_ACCOUNT }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          MACOS_SIGN_P12: ${{ matrix.goos == 'darwin' && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ matrix.goos == 'darwin' && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_NOTARY_KEY: ${{ matrix.goos == 'darwin' && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ matrix.goos == 'darwin' && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ matrix.goos == 'darwin' && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
      - name: Verify GoReleaser partial artifact
        shell: bash
        run: |
          set -euo pipefail
          dir="dist/${{ matrix.goos }}_${{ matrix.goarch }}"
          if [[ ! -d "$dir" ]] || [[ -z "$(find "$dir" -type f | head -1)" ]]; then
            echo "::error::GoReleaser did not produce partial artifacts in $dir"
            find dist -type f 2>/dev/null || true
            exit 1
          fi
          echo "Partial artifacts ready in $dir:"
          find "$dir" -type f | head -20
      # Tar preserves executable permissions, symlinks and hidden context files.
      - name: Archive GoReleaser context
        shell: bash
        run: tar -czf "${{ matrix.build_id }}.tar.gz" -C dist "${{ matrix.goos }}_${{ matrix.goarch }}"
      - name: Upload GoReleaser context
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-context-${{ matrix.build_id }}
          path: ${{ matrix.build_id }}.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7



  release:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Download GoReleaser contexts from this run
        uses: actions/download-artifact@v8
        with:
          pattern: goreleaser-context-*
          path: release-contexts
          merge-multiple: true
      - name: Extract GoReleaser contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in macos_arm64 linux_amd64 linux_arm64 windows_amd64; do
            tar -xzf "release-contexts/${target}.tar.gz" -C dist
          done
      - name: Verify restored GoReleaser partial artifacts
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            darwin_arm64
            linux_amd64
            linux_arm64
            windows_amd64
          )
          missing=()
          for target in "${targets[@]}"; do
            dir="dist/${target}"
            if [[ ! -d "$dir" ]] || [[ -z "$(find "$dir" -type f 2>/dev/null | head -1)" ]]; then
              missing+=("$target")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing or empty GoReleaser partial artifacts: ${missing[*]}"
            find dist -type f 2>/dev/null || true
            exit 1
          fi
          echo "All partial artifacts restored:"
          find dist -type f | head -50
      - name: Generate release app token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            otel-desktop-viewer
            homebrew-otel-desktop-viewer
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Complete release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: v2.19.0
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          # Set repo variable PRERELEASE_PUBLISH=true to push alpha/beta/rc to Homebrew, GHCR, and GemFury.
          PRERELEASE_PUBLISH: ${{ vars.PRERELEASE_PUBLISH }}
          FURY_ACCOUNT: ${{ vars.FURY_ACCOUNT }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
